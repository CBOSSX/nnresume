<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="本地简历编辑、预览、导出与版本管理工具" />
    <title>nnresume</title>
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("nnresume-theme-v1");
          const theme = preference === "light" || preference === "dark"
            ? preference
            : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="editor.css" />
    <script src="editor.js" defer></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img class="brand-logo" src="nnresume-logo.png" alt="nnresume" />
      </div>
      <nav class="tabs" aria-label="功能切换" data-active-tab="edit">
        <span class="tab-indicator" aria-hidden="true"></span>
        <button class="tab active" type="button" data-tab="edit"><span>编辑</span></button>
        <button class="tab" type="button" data-tab="history"><span>导出历史</span></button>
        <button class="tab" type="button" data-tab="git"><span>Git</span></button>
      </nav>
      <div class="header-controls">
        <div class="header-status" aria-live="polite">
          <span id="save-status" class="status-chip neutral">正在载入</span>
          <span id="git-status-chip" class="status-chip neutral">Git 检查中</span>
        </div>
        <div class="header-actions">
          <label class="theme-control">
            <span>主题</span>
            <select id="theme-select" aria-label="界面主题">
              <option value="system">系统</option>
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </label>
          <button id="save-button" class="button secondary" type="button">保存配置</button>
          <button id="export-button" class="button primary" type="button">导出版本</button>
        </div>
      </div>
    </header>

    <div id="draft-banner" class="draft-banner" hidden>
      <span>发现比磁盘配置更新的本地草稿。</span>
      <div>
        <button id="restore-draft" class="text-button" type="button">恢复草稿</button>
        <button id="discard-draft" class="text-button muted" type="button">丢弃</button>
      </div>
    </div>

    <main class="workspace">
      <section class="control-panel" aria-label="简历管理面板">
        <div id="validation-errors" class="validation-errors" hidden></div>
        <section id="edit-panel" class="tab-panel active">
          <form id="editor-form" autocomplete="off"></form>
        </section>
        <section id="history-panel" class="tab-panel" hidden>
          <div class="panel-heading">
            <div>
              <h2>导出历史</h2>
              <p>每个版本都保留配置快照和可追溯信息。</p>
            </div>
            <button id="refresh-history" class="button ghost compact" type="button">刷新</button>
          </div>
          <div id="history-list" class="history-list"></div>
        </section>
        <section id="git-panel" class="tab-panel" hidden>
          <div class="panel-heading">
            <div>
              <h2>Git 版本</h2>
              <p>保存配置后，再创建一个可回退的源码版本。</p>
            </div>
          </div>
          <div id="git-details" class="git-details"></div>
          <label class="field">
            <span>提交说明</span>
            <input id="commit-message" maxlength="200" placeholder="例如：docs: refine AI project bullets" />
          </label>
          <button id="commit-button" class="button primary full" type="button">创建 Git 版本</button>
          <div class="git-sync-actions">
            <button id="fetch-button" class="button ghost" type="button">刷新远程</button>
            <button id="pull-button" class="button ghost" type="button">拉取</button>
            <button id="push-button" class="button secondary" type="button">推送</button>
          </div>
        </section>
      </section>

      <section class="preview-panel" aria-label="实时 A4 预览">
        <div class="preview-toolbar">
          <div class="preview-heading">
            <div>
              <strong>实时预览</strong>
              <span>保存前也会随表单更新</span>
            </div>
          </div>
          <div class="preview-tools" aria-label="预览缩放">
            <span id="layout-status" class="status-chip neutral" aria-live="polite">A4 检查中</span>
            <div class="zoom-control">
              <button id="zoom-out" class="preview-tool-button" type="button" aria-label="缩小预览" title="缩小预览">−</button>
              <output id="zoom-value" aria-live="polite">100%</output>
              <button id="zoom-in" class="preview-tool-button" type="button" aria-label="放大预览" title="放大预览">＋</button>
            </div>
            <button id="zoom-fit" class="preview-tool-button fit-button active" type="button" aria-label="适合窗口" aria-pressed="true" title="适合窗口">适合</button>
            <a class="preview-tool-button open-preview" href="preview.html" target="_blank" aria-label="单独打开预览" title="单独打开预览">↗</a>
          </div>
        </div>
        <div id="preview-stage" class="preview-stage">
          <div id="preview-canvas" class="preview-canvas">
            <iframe id="preview-frame" title="简历 A4 实时预览" src="preview.html?embedded=1" scrolling="no"></iframe>
          </div>
        </div>
      </section>
    </main>

    <dialog id="export-dialog" class="dialog">
      <form method="dialog">
        <div class="dialog-heading">
          <div>
            <h2>导出新版本</h2>
            <p>将生成唯一目录，并保存本次配置快照。</p>
          </div>
          <button class="icon-button" value="cancel" aria-label="关闭">×</button>
        </div>
        <label class="field">
          <span>版本标签</span>
          <input id="export-label" maxlength="40" value="resume" placeholder="例如 backend-v2" />
        </label>
        <div class="dialog-actions">
          <button class="button ghost" value="cancel">取消</button>
          <button id="confirm-export" class="button primary" value="default" type="button">保存并导出</button>
        </div>
      </form>
    </dialog>

    <dialog id="diff-dialog" class="dialog wide">
      <form method="dialog">
        <div class="dialog-heading">
          <div>
            <h2 id="diff-title">配置差异</h2>
            <p>当前编辑内容与历史快照的字段级比较。</p>
          </div>
          <button class="icon-button" value="cancel" aria-label="关闭">×</button>
        </div>
        <div id="diff-content" class="diff-content"></div>
        <div class="dialog-actions">
          <button class="button primary" value="cancel">完成</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
